[project]
name = "hume-pod-ha"
version = "0.3.2"
requires-python = ">=3.13"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP", "SIM", "RUF", "ASYNC", "PL", "TID"]
ignore = ["PLR0913", "PLR0917", "PLR2004", "PLR0912", "PLR0915", "RUF001", "E501"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components.hume_pod"]
combine-as-imports = true

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLC0415", "SIM117", "PLR0915"]
